<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>CaobaPOS</title>
  <meta name="description" content="Punto de Venta Premium, Inteligente y Offline-Resiliente" />
  
  <!-- Manifest Configuration (crossorigin use-credentials allows loading on protected Vercel previews) -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <meta name="theme-color" content="#CD9B46" />
  
  <!-- iOS / Apple Web App Settings (iOS Chin Bug fix: status-bar-style must be 'black', never 'black-translucent') -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="CaobaPOS" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  
  <!--
    Fonts are self-hosted from /fonts below. The previous render-blocking Google Fonts
    request duplicated every one of those files and also pulled weights and italics the
    app never renders, so it was removed rather than trimmed.
  -->
  <style>
    /* Self-hosted brand fonts */
    @font-face {
      font-family: 'Parkinsans';
      font-weight: 400;
      font-style: normal;
      src: local('Parkinsans Regular'), local('Parkinsans-Regular'),
           url('/fonts/Parkinsans_400Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Parkinsans';
      font-weight: 600;
      font-style: normal;
      src: local('Parkinsans SemiBold'), local('Parkinsans-SemiBold'),
           url('/fonts/Parkinsans_600SemiBold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Parkinsans';
      font-weight: 700;
      font-style: normal;
      src: local('Parkinsans Bold'), local('Parkinsans-Bold'),
           url('/fonts/Parkinsans_700Bold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Parkinsans';
      font-weight: 800;
      font-style: normal;
      src: local('Parkinsans ExtraBold'), local('Parkinsans-ExtraBold'),
           url('/fonts/Parkinsans_800ExtraBold.ttf') format('truetype');
    }

    @font-face {
      font-family: 'JetBrains Mono';
      font-weight: 400;
      font-style: normal;
      src: local('JetBrains Mono Regular'), local('JetBrainsMono-Regular'),
           url('/fonts/JetBrainsMono_400Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-weight: 500;
      font-style: normal;
      src: local('JetBrains Mono Medium'), local('JetBrainsMono-Medium'),
           url('/fonts/JetBrainsMono_500Medium.ttf') format('truetype');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-weight: 600;
      font-style: normal;
      src: local('JetBrains Mono SemiBold'), local('JetBrainsMono-SemiBold'),
           url('/fonts/JetBrainsMono_600SemiBold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-weight: 700;
      font-style: normal;
      src: local('JetBrains Mono Bold'), local('JetBrainsMono-Bold'),
           url('/fonts/JetBrainsMono_700Bold.ttf') format('truetype');
    }

    /* Premium Caoba Reset and Base Layout */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #140906;
      overflow: hidden;
      font-family: 'Parkinsans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F5EFE8;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Native form controls do not inherit font-family, so restate the brand font here */
    input, select, textarea, button {
      font-family: 'Parkinsans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Fixed 100dvh root to bypass iOS Chin Gap */
    #root {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
    }

    /* Brand loading splash */
    #pwa-loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1C110C 0%, #140906 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    .splash-logo {
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.4));
      border-radius: 24px;
    }

    .splash-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(205, 155, 70, 0.15);
      border-radius: 50%;
      border-top-color: #CD9B46;
      animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .splash-text {
      margin-top: 16px;
      font-size: 14px;
      /* Parkinsans ships no 500 — asking for it makes the browser synthesise a weight */
      font-weight: 600;
      color: #B3A294;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Inline loading splash screen -->
  <div id="pwa-loading-splash">
    <img class="splash-logo" src="/icon-192.png" alt="CaobaPOS" />
    <div class="splash-spinner"></div>
    <div class="splash-text">Cargando CaobaPOS</div>
  </div>

  <!-- Metro Web Root Container -->
  <div id="root"></div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('✨ Service Worker registrado con éxito:', registration.scope);
          })
          .catch(error => {
            console.warn('❌ Registro de Service Worker fallido:', error);
          });
      });
    }

    // Auto-remove splash when App is mounted
    const observer = new MutationObserver((mutations, obs) => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const splash = document.getElementById('pwa-loading-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }
        obs.disconnect();
      }
    });
    observer.observe(document, { childList: true, subtree: true });
  </script>
</body>
</html>
