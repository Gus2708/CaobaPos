<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>CaobaPOS</title>
  <meta name="description" content="Punto de Venta Premium, Inteligente y Offline-Resiliente" />
  
  <!-- Manifest Configuration -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#905030" />
  
  <!-- iOS / Apple Web App Settings (iOS Chin Bug fix: status-bar-style must be 'black', never 'black-translucent') -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="CaobaPOS" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  
  <!-- Preconnect to external API/Font endpoints for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <style>
    /* Premium Reset and Base Layout */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0A0C;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #F4F4F5;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Fixed 100dvh root to bypass iOS Chin Gap */
    #root {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
    }

    /* Premium Mahogany skeleton loading view */
    #pwa-loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1C120C 0%, #0A0A0C 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    .splash-logo {
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, #A85A38 0%, #6E361D 100%);
      box-shadow: 0 12px 32px rgba(144, 80, 48, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 36px;
      color: #FFF;
      letter-spacing: -1px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .splash-logo::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .splash-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(144, 80, 48, 0.1);
      border-radius: 50%;
      border-top-color: #A85A38;
      animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .splash-text {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
      color: #A1A1AA;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Inline loading splash screen -->
  <div id="pwa-loading-splash">
    <div class="splash-logo">C</div>
    <div class="splash-spinner"></div>
    <div class="splash-text">Cargando CaobaPOS</div>
  </div>

  <!-- Metro Web Root Container -->
  <div id="root"></div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('✨ Service Worker registrado con éxito:', registration.scope);
          })
          .catch(error => {
            console.warn('❌ Registro de Service Worker fallido:', error);
          });
      });
    }

    // Auto-remove splash when App is mounted
    const observer = new MutationObserver((mutations, obs) => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const splash = document.getElementById('pwa-loading-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }
        obs.disconnect();
      }
    });
    observer.observe(document, { childList: true, subtree: true });
  </script>
</body>
</html>
