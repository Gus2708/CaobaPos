name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # --forceExit porque TanStack Query deja timers vivos al terminar la
      # suite y jest se queda colgado esperandolos. Es una fuga real de
      # teardown en los tests, no del build: queda anotada para arreglarla.
      - name: Tests
        run: npx jest --ci --forceExit
